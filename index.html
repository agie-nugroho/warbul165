<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kasir WARBUL 165</title>
    <style>
      :root {
        --bg: #131417;
        --pn: #1b1d22;
        --pn2: #24272d;
        --tx: #eceae4;
        --mt: #9a9a96;
        --ac: #d4a85a;
        --ac2: #e8c987;
        --ok: #5fc48a;
        --er: #ef7a6e;
        --ln: #2e3137;
        --in: #0f1013;
        --on: #2a2518;
        --dbg: #3a2220;
        --dtx: #ffb9b0;
        --dot: transparent;
        --sh: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      [data-tema="terang"] {
        --bg: #f5f4f0;
        --pn: #ffffff;
        --pn2: #efede8;
        --tx: #1f2024;
        --mt: #6b6c70;
        --ac: #c99a3c;
        --ac2: #8a6420;
        --ln: #e2dfd7;
        --ok: #1e8a4d;
        --er: #c0392b;
        --in: #ffffff;
        --on: #f7edd5;
        --dbg: #fbe3df;
        --dtx: #8a2318;
        --dot: transparent;
        --sh: 0 8px 24px rgba(40, 35, 20, 0.08);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.45 "Avenir Next",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        padding-bottom: 84px;
        background-image: radial-gradient(var(--dot) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      h1,
      h2,
      h3 {
        font-family: Georgia, "Times New Roman", serif;
        margin: 0;
        font-weight: 700;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        border-radius: 12px;
        background: var(--pn2);
        padding: 12px 16px;
        min-height: 48px;
        transition: transform 0.08s;
      }
      button:active {
        transform: scale(0.96);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--ac2);
        outline-offset: 2px;
      }
      input,
      select {
        background: var(--in);
        border: 2px solid var(--ln);
        border-radius: 12px;
        padding: 12px;
        min-height: 48px;
        width: 100%;
      }
      .pri {
        background: var(--ac);
        color: #201a10;
        font-weight: 700;
      }
      .dng {
        background: var(--dbg);
        color: var(--dtx);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 20px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--ln);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 20;
      }
      header h1 {
        font-size: 26px;
        color: var(--ac2);
        letter-spacing: 3px;
      }
      nav {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }
      #tema {
        border: 2px solid var(--ln);
        background: transparent;
        white-space: nowrap;
      }
      nav button {
        background: transparent;
        border: 2px solid var(--ln);
        min-width: 84px;
      }
      nav button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #201a10;
        font-weight: 700;
      }
      main {
        padding: 14px;
        max-width: 1300px;
        margin: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 16px;
        align-items: start;
      }
      .card {
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: 18px;
        padding: 16px;
        box-shadow: var(--sh);
      }
      .cats {
        display: flex;
        gap: 8px;
        margin: 10px 0;
        overflow-x: auto;
      }
      .cats button {
        flex: 1;
        white-space: nowrap;
        border: 2px solid var(--ln);
        background: transparent;
      }
      .cats button.on {
        border-color: var(--ac2);
        color: var(--ac2);
        background: var(--on);
      }
      #menuGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 10px;
      }
      .mi {
        background: var(--pn2);
        border-radius: 14px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .mi b {
        font-size: 16px;
      }
      .ph {
        height: 170px;
        border-radius: 10px;
        background: var(--in);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        overflow: hidden;
      }
      .ph.img,
      .th.img {
        background: #fff;
      }
      .ph img,
      .th img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .th {
        width: 52px;
        height: 52px;
        border-radius: 8px;
        background: var(--in);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        overflow: hidden;
        vertical-align: middle;
        margin-right: 8px;
      }
      #fPrev {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
      }
      #fPrev .ph {
        width: 130px;
        height: 130px;
        flex: none;
      }
      .mi button {
        background: var(--in);
        border: 2px solid var(--ac);
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
      }
      .mi button span {
        color: var(--ac2);
        font-weight: 700;
      }
      .mi .ex {
        border-color: var(--ln);
        font-size: 14px;
      }
      .empty {
        color: var(--mt);
        text-align: center;
        padding: 24px;
      }
      #cart {
        position: sticky;
        top: 76px;
      }
      #cart h2 {
        font-size: 22px;
        margin-bottom: 8px;
      }
      .line {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 8px;
        padding: 10px 0;
        border-bottom: 1px dashed var(--ln);
      }
      .line .q {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .line .q button {
        min-height: 40px;
        width: 40px;
        padding: 0;
        font-size: 20px;
      }
      .line small {
        color: var(--mt);
      }
      .total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 20px;
        margin: 12px 0 6px;
      }
      .total b {
        font-size: 32px;
        color: var(--ac2);
      }
      .qk {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 8px 0;
      }
      .qk button {
        padding: 8px 4px;
        font-size: 14px;
      }
      .kb {
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        margin: 8px 0;
      }
      .kb b {
        font-size: 22px;
      }
      .warn {
        color: var(--er);
      }
      .good {
        color: var(--ok);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 1;
      }
      #bar,
      #closeSheet {
        display: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--ln);
        text-align: left;
      }
      td.r,
      th.r {
        text-align: right;
      }
      th {
        color: var(--ac2);
      }
      .wrap {
        overflow-x: auto;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
        margin: 12px 0;
      }
      .stat {
        background: var(--pn2);
        border-radius: 14px;
        padding: 12px;
      }
      .stat small {
        color: var(--mt);
      }
      .stat div {
        font-size: 22px;
        font-weight: 700;
        color: var(--ac2);
      }
      .bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 8px;
      }
      .bar > input {
        max-width: 220px;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 14px;
        z-index: 50;
        overflow: auto;
      }
      .modal.on {
        display: flex;
      }
      .box {
        background: var(--pn);
        border-radius: 16px;
        padding: 18px;
        width: 100%;
        max-width: 440px;
        max-height: 96vh;
        overflow: auto;
      }
      .box label {
        display: block;
        margin: 10px 0 4px;
        color: var(--mt);
        font-size: 14px;
      }
      #strukBox {
        background: #faf7ee;
        color: #111;
        max-width: 340px;
        font-family: "Courier New", monospace;
        font-size: 13px;
      }
      #struk {
        padding: 6px 2px;
      }
      #struk .c {
        text-align: center;
      }
      #struk .d {
        border-top: 1px dashed #111;
        margin: 6px 0;
      }
      #struk .f {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      #struk .b {
        font-weight: 700;
        font-size: 15px;
      }
      #strukBtn {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      #strukBtn button {
        flex: 1;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        background: var(--ac);
        color: #201a10;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 700;
        display: none;
        z-index: 99;
      }
      [hidden] {
        display: none !important;
      }
      .onlyprint {
        display: none;
      }
      .tsvg {
        width: 100%;
        height: auto;
        display: block;
      }
      .tsvg .tg {
        stroke: var(--ln);
        stroke-width: 1;
      }
      .tsvg .tl {
        fill: none;
        stroke: var(--ac);
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .tsvg .ta {
        fill: var(--ac);
        opacity: 0.16;
      }
      .tsvg .td {
        fill: var(--pn);
        stroke: var(--ac);
        stroke-width: 2;
      }
      .tsvg .tn {
        fill: var(--ac);
        stroke: var(--ac);
      }
      .tsvg .tx {
        fill: var(--mt);
        font-size: 11px;
      }
      .tsvg .th2 {
        fill: transparent;
      }
      .bar > select {
        width: auto;
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        overflow-x: auto;
        padding: 6px 0 2px;
        min-height: 60px;
      }
      .cb {
        flex: 1;
        min-width: 34px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
      }
      .cb i {
        display: block;
        width: 100%;
        background: var(--ac);
        border-radius: 6px 6px 0 0;
      }
      .cb small {
        color: var(--mt);
        font-size: 11px;
      }
      .mi.habis {
        opacity: 0.45;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
        #cart {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          top: auto;
          z-index: 40;
          border-radius: 20px 20px 0 0;
          max-height: 88vh;
          overflow-y: auto;
          transform: translateY(105%);
          transition: transform 0.25s;
          box-shadow: 0 -8px 30px #000a;
        }
        #cart.open {
          transform: none;
        }
        #bar {
          display: flex;
          position: fixed;
          left: 10px;
          right: 10px;
          bottom: 10px;
          z-index: 30;
          justify-content: space-between;
          background: var(--ac);
          color: #201a10;
          font-weight: 700;
          font-size: 18px;
          padding: 14px 18px;
          min-height: 56px;
          box-shadow: 0 4px 14px #000a;
        }
        #closeSheet {
          display: block;
          width: 100%;
          margin-bottom: 8px;
        }
      }
      /* Cetak: hanya struk yang tercetak */
      @media print {
        @page {
          margin: 0;
        }
        body {
          background: #fff;
          padding: 0;
        }
        body > *:not(#modalStruk) {
          display: none !important;
        }
        #modalStruk {
          display: block !important;
          position: static;
          background: none;
          padding: 0;
        }
        #strukBox {
          box-shadow: none;
          max-width: none;
          width: 72mm;
          padding: 2mm;
          max-height: none;
        }
        #strukBtn {
          display: none;
        }
        /* Cetak laporan rekap: tampilan putih-hitam, hanya bagian Rekap */
        body.rekap {
          --bg: #fff;
          --pn: #fff;
          --pn2: #f3f3f3;
          --tx: #111;
          --mt: #555;
          --ac: #555;
          --ac2: #111;
          --ln: #ccc;
          --in: #fff;
          --sh: none;
          --ok: #111;
          --er: #111;
          background: #fff;
          color: #111;
        }
        body.rekap > #utama {
          display: block !important;
          padding: 12mm;
        }
        body.rekap #vKasir,
        body.rekap #vMenu,
        body.rekap #modalStruk,
        body.rekap #vRekap button,
        body.rekap #vRekap select,
        body.rekap #vRekap input {
          display: none !important;
        }
        body.rekap .onlyprint {
          display: block !important;
          font:
            700 18px Georgia,
            serif;
          margin-bottom: 10px;
        }
        body.rekap .card {
          border: 0;
          box-shadow: none;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="peringatan"
      hidden
      style="
        background: #c0392b;
        color: #fff;
        padding: 10px 16px;
        font-weight: 700;
        text-align: center;
      "
    >
      Penyimpanan browser tidak aktif (mode privat?). Data TIDAK akan tersimpan.
      Buka lewat jendela biasa.
    </div>
    <header>
      <h1>WARBUL 165</h1>
      <nav>
        <button data-t="kasir" class="on">Kasir</button>
        <button data-t="rekap">Rekap</button>
        <button data-t="menu">Menu</button>
      </nav>
      <button id="tema" aria-label="Ganti tema"></button>
    </header>

    <main id="utama">
      <!-- KASIR -->
      <section id="vKasir" class="grid">
        <div class="card">
          <input
            id="cari"
            type="search"
            placeholder="Cari menu…"
            aria-label="Cari menu"
          />
          <div class="cats" id="cats">
            <button data-k="panas" class="on">Minuman Panas</button>
            <button data-k="dingin">Minuman Dingin</button>
            <button data-k="makanan">Makanan</button>
          </div>
          <div id="menuGrid"></div>
        </div>
        <aside class="card" id="cart">
          <button id="closeSheet">Tutup ▾</button>
          <h2>Pesanan</h2>
          <div id="lines"></div>
          <input
            id="catatan"
            placeholder="Catatan (nama pelanggan / no. meja)"
            style="margin-top: 10px"
          />
          <div class="total"><span>Total</span><b id="total">Rp 0</b></div>
          <div class="cats" id="metode">
            <button data-m="Tunai" class="on">Tunai</button
            ><button data-m="QRIS">QRIS</button
            ><button data-m="Transfer">Transfer</button>
          </div>
          <label for="bayar" style="color: var(--mt); font-size: 14px"
            >Uang Diterima</label
          >
          <input id="bayar" inputmode="numeric" placeholder="Rp 0" />
          <div class="qk" id="qk"></div>
          <div class="kb">
            <span id="kLabel">Kembalian</span><b id="kembali">Rp 0</b>
          </div>
          <div class="row">
            <button class="dng" id="kosong">Kosongkan</button>
            <button class="pri" id="btnBayar" disabled>Bayar</button>
          </div>
        </aside>
      </section>

      <!-- REKAP -->
      <section id="vRekap" hidden>
        <div class="card">
          <div id="judulCetak" class="onlyprint"></div>
          <div class="bar">
            <select id="periode" aria-label="Periode">
              <option value="hari">Harian</option>
              <option value="minggu">7 Hari Terakhir</option>
              <option value="bulan">Bulanan</option>
            </select>
            <input type="date" id="tgl" aria-label="Tanggal" />
            <button id="hariIni">Hari Ini</button
            ><button id="kemarin">Kemarin</button>
            <button id="csv" class="pri">Export CSV</button>
            <button id="cetakRekap">Cetak Laporan</button>
          </div>
          <div class="stats" id="stats"></div>
          <div class="bar" style="margin-top: 8px">
            <h3>Tren Penjualan</h3>
            <select
              id="trenRange"
              aria-label="Rentang tren"
              style="margin-left: auto"
            >
              <option value="7">7 Hari</option>
              <option value="30">30 Hari</option>
              <option value="12m">12 Bulan</option>
            </select>
          </div>
          <div id="tren"></div>
          <h3 style="margin-top: 18px">Penjualan per Jam</h3>
          <div class="chart" id="chart"></div>
          <div class="bar" style="margin-top: 18px">
            <h3>Pengeluaran</h3>
            <button id="tambahKeluar" style="margin-left: auto">
              + Catat Pengeluaran
            </button>
          </div>
          <div class="wrap" id="tbKeluar"></div>
          <h3 style="margin-top: 18px">Daftar Transaksi</h3>
          <div class="wrap" id="tbTrx"></div>
          <h3 style="margin-top: 18px">Menu Terlaris</h3>
          <div class="wrap" id="tbTop"></div>
        </div>
      </section>

      <!-- KELOLA MENU -->
      <section id="vMenu" hidden>
        <div class="card">
          <div class="bar">
            <button class="pri" id="tambahMenu">+ Tambah Menu</button>
            <button id="backup">Cadangkan Data</button>
            <button id="restore">Pulihkan Data</button>
            <input
              type="file"
              id="fileRestore"
              accept=".json,application/json"
              hidden
            />
            <small id="infoBackup" style="color: var(--mt)"></small>
            <button class="dng" id="resetMenu">Reset ke menu awal</button>
          </div>
          <div class="wrap" id="tbMenu"></div>
        </div>
      </section>
    </main>

    <button id="bar">
      <span id="barN">0 item</span><span id="barT">Rp 0</span>
    </button>

    <!-- Modal form menu -->
    <div class="modal" id="modalForm">
      <div class="box">
        <h3 id="fJudul">Menu</h3>
        <label>Nama menu</label><input id="fNama" />
        <label>Kategori</label>
        <select id="fKat">
          <option value="minuman">Minuman</option>
          <option value="makanan">Makanan</option>
        </select>
        <div id="fMin">
          <label>Harga Panas (kosongkan jika tidak ada)</label
          ><input id="fPanas" inputmode="numeric" />
          <label>Harga Dingin (kosongkan jika tidak ada)</label
          ><input id="fDingin" inputmode="numeric" />
        </div>
        <div id="fMak">
          <label>Harga</label><input id="fHarga" inputmode="numeric" />
        </div>
        <label>Tambahan (opsional), contoh: + pake telor</label
        ><input id="fTamNama" /> <label>Harga tambahan</label
        ><input id="fTamHarga" inputmode="numeric" />
        <label>Foto menu (opsional)</label>
        <div id="fPrev"></div>
        <div class="row" style="margin-top: 8px">
          <button id="fFotoBtn" type="button">Pilih / Ambil Foto</button>
          <button id="fFotoHapus" type="button">Hapus Foto</button>
        </div>
        <input type="file" id="fFile" accept="image/*" hidden />
        <div class="row" style="margin-top: 16px">
          <button id="fBatal">Batal</button
          ><button class="pri" id="fSimpan">Simpan</button>
        </div>
      </div>
    </div>

    <!-- Modal struk -->
    <div class="modal" id="modalStruk">
      <div class="box" id="strukBox">
        <div id="struk"></div>
        <div id="strukBtn">
          <button class="pri" id="cetak">Cetak Struk</button>
          <button id="baru" style="background: #ddd; color: #111">
            Transaksi Baru
          </button>
        </div>
      </div>
    </div>

    <!-- Modal pengeluaran -->
    <div class="modal" id="modalKeluar">
      <div class="box">
        <h3>Catat Pengeluaran</h3>
        <label>Keterangan (contoh: beli gas, kopi, es batu)</label
        ><input id="kKet" /> <label>Jumlah</label
        ><input id="kJml" inputmode="numeric" placeholder="Rp 0" />
        <label>Tanggal</label><input type="date" id="kTgl" />
        <div class="row" style="margin-top: 16px">
          <button id="kBatal">Batal</button
          ><button class="pri" id="kSimpan">Simpan</button>
        </div>
      </div>
    </div>

    <div class="modal" id="login">
      <div class="box">
        <h3>Masuk Kasir</h3>
        <label>Email</label

    <script>
      /* ===== Utilitas ===== */
      const $ = (s) => document.querySelector(s);
      const rp = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
      const num = (s) => parseInt(String(s).replace(/\D/g, "")) || 0;
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const pad = (n) => String(n).padStart(2, "0");
      const kunciTgl = (d) =>
        d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); // tanggal lokal
      const jam = (d) => pad(d.getHours()) + "." + pad(d.getMinutes());
      const tglIndo = (d) =>
        d.toLocaleDateString("id-ID", {
          day: "2-digit",
          month: "long",
          year: "numeric",
        });
      const baca = (k, f) => {
        try {
          return JSON.parse(localStorage.getItem(k)) || f;
        } catch (e) {
          return f;
        }
      };
      const tulis = (k, v) => {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {
          toast("Gagal menyimpan data");
        }
      };
      let tt;
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.style.display = "block";
        clearTimeout(tt);
        tt = setTimeout(() => (t.style.display = "none"), 1800);
      }

      /* ===== Data menu awal ===== */
      function menuAwal() {
        let i = 0;
        const d = (nama, panas, dingin) => ({
          id: "m" + ++i,
          nama,
          kat: "minuman",
          panas,
          dingin,
          harga: 0,
          tambahan: [],
          gambar: FOTO_AWAL[nama] || "",
          gambarDingin: FOTO_DINGIN[nama] || "",
        });
        const f = (nama, harga, t) => ({
          id: "m" + ++i,
          nama,
          kat: "makanan",
          panas: 0,
          dingin: 0,
          harga,
          tambahan: t ? [{ nama: t[0], harga: t[1] }] : [],
          gambar: FOTO_AWAL[nama] || "",
        });
        return [
          d("Kapal Api", 3000, 0),
          d("ABC Susu", 4000, 0),
          d("Good Day All Variant", 4000, 5000),
          d("Good Day Freeze", 5000, 6000),
          d("ABC Klepon", 5000, 6000),
          d("Indocafe", 4000, 5000),
          d("Good Day Cappucino", 5000, 6000),
          d("Kopi Juwara", 10000, 11000),
          d("Kopi Gingseng", 10000, 11000),
          d("Teh Tawar", 2000, 0),
          d("Teh Manis", 3000, 4000),
          d("Teh Tarik", 4000, 5000),
          d("Susu Jahe", 4000, 5000),
          d("Milo", 4000, 5000),
          d("Ovaltine", 5000, 6000),
          d("Drink Beng Beng", 5000, 6000),
          d("Choclatos All Variant", 5000, 6000),
          d("Nutrisari All Variant", 3000, 4000),
          d("Pop Ice All Variant", 0, 6000),
          f("Indomie Goreng biasa", 6000, ["+ pake telor", 3000]),
          f("Indomie Rebus biasa", 6000, ["+ pake telor", 3000]),
          f("Pop Mie goreng", 5000),
          f("Pop Mie rebus", 5000),
          f("Roti Bakar ori", 7000, ["+ pake rasa", 2000]),
          f("Sosis goreng", 5000),
          f("Baso goreng", 5000),
          f("Kentang goreng", 5000),
          f("Mix platter", 7000),
        ];
      }

      /* ===== Supabase ===== */
      const sb = supabase.createClient(
        "https://qjmhiuxadlqhljkzuvaq.supabase.co",
        "sb_publishable_KKZrrK1iD0icTNtfuAT8UA_T_vpW-r9",
      );
      async function dbUp(t, rows) {
        const sz = t === "menu" ? 5 : 200;
        for (let i = 0; i < rows.length; i += sz) {
          const { error } = await sb.from(t).upsert(
            rows.slice(i, i + sz).map((r) => ({
              id: r.id,
              data: r,
              updated_at: new Date().toISOString(),
            })),
          );
          if (error) {
            toast("Gagal sinkron: " + error.message);
            return false;
          }
        }
        return true;
      }
      async function dbDel(t, id) {
        if (!window.cloudSiap) return;
        const { error } = await sb.from(t).delete().eq("id", id);
        if (error) toast("Gagal hapus di cloud: " + error.message);
      }
      async function dbLoad(t) {
        let all = [],
          from = 0;
        for (;;) {
          const { data, error } = await sb
            .from(t)
            .select("data")
            .range(from, from + 999);
          if (error) throw error;
          all = all.concat(data.map((r) => r.data));
          if (data.length < 1000) break;
          from += 1000;
        }
        return all;
      }

      /* ===== State ===== */

      /* Migrasi data lama: ganti nama Torabika & isi foto bawaan yang masih kosong */
      menu.forEach((m) => {
        if (m.nama === "Torabika Cappucino") m.nama = "Good Day Cappucino";
        if (!m.gambar && FOTO_AWAL[m.nama]) m.gambar = FOTO_AWAL[m.nama];
      });
      /* Pembaruan sekali jalan: foto teh diganti ke foto es teh */
      let mig2 = null;
      try {
        mig2 = localStorage.getItem("warbul_mig2");
      } catch (e) {}
      if (!mig2) {
        menu.forEach((m) => {
          if (m.nama === "Teh Tawar" || m.nama === "Teh Manis")

        });
        try {
          localStorage.setItem("warbul_mig2", "1");
        } catch (e) {}
      }
      /* Pembaruan sekali jalan: Teh Panas pakai foto teh hangat, varian Dingin pakai foto es teh */
      let mig3 = null;
      try {
        mig3 = localStorage.getItem("warbul_mig3");
      } catch (e) {}
      if (!mig3) {
        menu.forEach((m) => {
          if (m.nama === "Teh Tawar" || m.nama === "Teh Manis") {

      let trx = baca("warbul_trx", []);

      /* ===== Navigasi tab ===== */

        (b) =>

              .querySelectorAll("nav button")

      /* ===== Gambar menu: foto unggahan, atau ikon emoji bawaan ===== */
      function ikon(m) {
        const n = m.nama.toLowerCase();
        if (/indomie|pop mie/.test(n)) return "🍜";
        if (/roti/.test(n)) return "🍞";
        if (/sosis/.test(n)) return "🌭";
        if (/baso/.test(n)) return "🍢";
        if (/kentang/.test(n)) return "🍟";
        if (/platter/.test(n)) return "🍱";
        if (/teh/.test(n)) return "🍵";
        if (/pop ice|nutrisari/.test(n)) return "🧃";
        if (/susu|milo|ovaltine|choclatos|beng/.test(n)) return "🥛";
        return m.kat === "makanan" ? "🍽️" : "☕";
      }
      const foto = (m, c, v) => {
        const g = (v === "dingin" && m.gambarDingin) || m.gambar;
        return `<div class="${c}${g ? " img" : ""}">${g ? `<img src="${g}" alt="${esc(m.nama)}">` : ikon(m)}</div>`;
      };
      /* Perkecil foto (maks 320px, JPEG) supaya hemat ruang localStorage */
      function kecilkan(file, cb) {
        const r = new FileReader();
        r.onload = () => {
          const im = new Image();
          im.onload = () => {
            const s = Math.min(1, 320 / Math.max(im.width, im.height)),
              c = document.createElement("canvas");
            c.width = Math.round(im.width * s);
            c.height = Math.round(im.height * s);
            c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
            cb(c.toDataURL("image/jpeg", 0.72));
          };
          im.onerror = () => toast("File bukan gambar yang valid");
          im.src = r.result;
        };
        r.readAsDataURL(file);
      }

      /* ===== KASIR: daftar menu ===== */
      document.querySelectorAll("#cats button").forEach(
        (b) =>

      $("#cari").oninput = renderMenu;

      function renderMenu() {
        const q = $("#cari").value.trim().toLowerCase();
        let h = "";
        menu.forEach((m) => {
          if (q && !m.nama.toLowerCase().includes(q)) return;
          let btn = "";
          if (kat === "panas" && m.kat === "minuman" && m.panas > 0)
            btn = `<button onclick="tambah('${m.id}','panas')">Panas <span>${rp(m.panas)}</span></button>`;
          if (kat === "dingin" && m.kat === "minuman" && m.dingin > 0)
            btn = `<button onclick="tambah('${m.id}','dingin')">Dingin <span>${rp(m.dingin)}</span></button>`;
          if (kat === "makanan" && m.kat === "makanan") {
            btn = `<button onclick="tambah('${m.id}','main')">Pesan <span>${rp(m.harga)}</span></button>`;
            m.tambahan.forEach(
              (t, i) =>
                (btn += `<button class="ex" onclick="tambah('${m.id}','ex${i}')">${esc(t.nama)} <span>+${rp(t.harga)}</span></button>`),
            );
          }
          if (btn && m.habis)
            btn = btn.replace(/<button /g, "<button disabled ");
          if (btn)
            h += `<div class="mi${m.habis ? " habis" : ""}">${foto(m, "ph", kat)}<b>${esc(m.nama)}${m.habis ? " · Habis" : ""}</b>${btn}</div>`;
        });
        $("#menuGrid").innerHTML =
          h || '<div class="empty">Menu tidak ditemukan.</div>';
      }

      function tambah(id, v) {
        const m = menu.find((x) => x.id === id);
        if (!m || m.habis) return;
        let nama = m.nama,
          harga = 0;
        if (v === "panas") {
          nama += " (Panas)";
          harga = m.panas;
        } else if (v === "dingin") {
          nama += " (Dingin)";
          harga = m.dingin;
        } else if (v === "main") {
          harga = m.harga;
        } else {
          const t = m.tambahan[+v.slice(2)];
          nama += " " + t.nama;
          harga = t.harga;
        }
        const key = id + "|" + v,
          ada = cart.find((c) => c.key === key);
        if (ada) ada.qty++;
        else cart.push({ key, nama, harga, qty: 1 });
        renderCart();
      }

      /* ===== KASIR: keranjang & pembayaran ===== */
      const totalCart = () => cart.reduce((s, c) => s + c.harga * c.qty, 0);
      const jmlItem = () => cart.reduce((s, c) => s + c.qty, 0);

      function ubahQty(key, d) {
        const c = cart.find((x) => x.key === key);
        if (!c) return;
        c.qty += d;
        if (c.qty <= 0) cart = cart.filter((x) => x !== c);
        renderCart();
      }
      function hapus(key) {
        cart = cart.filter((x) => x.key !== key);
        renderCart();
      }

      function renderCart() {
        $("#lines").innerHTML = cart.length
          ? cart
              .map(
                (c) => `
    <div class="line">
      <div><b>${esc(c.nama)}</b><br><small>${rp(c.harga)} × ${c.qty} = ${rp(c.harga * c.qty)}</small></div>
      <div class="q">
        <button onclick="ubahQty('${c.key}',-1)" aria-label="Kurangi">−</button><b>${c.qty}</b>
        <button onclick="ubahQty('${c.key}',1)" aria-label="Tambah">+</button>
        <button class="dng" onclick="hapus('${c.key}')" aria-label="Hapus">✕</button>
      </div>
    </div>`,
              )
              .join("")
          : '<div class="empty">Keranjang kosong.<br>Pilih menu untuk mulai.</div>';
        const t = totalCart();
        $("#total").textContent = rp(t);
        $("#barN").textContent = jmlItem() + " item · Lihat Pesanan";
        $("#barT").textContent = rp(t);
        renderBayar();
      }

      function renderBayar() {
        const t = totalCart();
        if (metode !== "Tunai") {
          bayar = t;
          $("#bayar").value = t ? rp(t) : "";
        } // non-tunai: otomatis uang pas
        $("#bayar").disabled = metode !== "Tunai";
        const k = bayar - t;
        $("#kLabel").textContent = k < 0 && t > 0 ? "Status" : "Kembalian";
        const el = $("#kembali");
        if (t > 0 && k < 0) {
          el.textContent = "Uang kurang " + rp(-k);
          el.className = "warn";
        } else {
          el.textContent = rp(Math.max(k, 0));
          el.className = t > 0 && bayar > 0 ? "good" : "";
        }
        $("#btnBayar").disabled = !(t > 0 && bayar >= t);
      }
      function setBayar(n, isiInput) {
        bayar = n;
        if (isiInput) $("#bayar").value = n ? rp(n) : "";
        renderBayar();
      }

      $("#bayar").oninput = (e) => {
        bayar = num(e.target.value);
        e.target.value = bayar ? rp(bayar) : "";
        renderBayar();
      };
      $("#qk").innerHTML =
        '<button data-n="pas">Uang Pas</button>' +
        [5000, 10000, 20000, 50000, 100000]
          .map(
            (n) =>
              `<button data-n="${n}">${n.toLocaleString("id-ID")}</button>`,
          )
          .join("");
      $("#qk").onclick = (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (metode !== "Tunai") return toast("Non-tunai: jumlah otomatis pas");
        if (!totalCart()) {
          toast("Keranjang masih kosong");

        }
        setBayar(b.dataset.n === "pas" ? totalCart() : +b.dataset.n, true);
      };
      $("#kosong").onclick = () => {
        if (!cart.length) return toast("Keranjang sudah kosong");
        if (confirm("Kosongkan semua pesanan?")) resetKasir();
      };
      function resetKasir() {
        setMetode("Tunai");
        cart = [];
        bayar = 0;
        $("#bayar").value = "";
        $("#catatan").value = "";
        renderCart();
      }

      /* Bottom sheet di HP */
      $("#bar").onclick = () => $("#cart").classList.add("open");
      $("#closeSheet").onclick = () => $("#cart").classList.remove("open");

      /* ===== Simpan transaksi ===== */
      $("#btnBayar").onclick = () => {
        const t = totalCart();
        if (!cart.length) return toast("Keranjang kosong");
        if (bayar < t) return toast("Uang kurang");
        const now = new Date(),
          hari = kunciTgl(now);
        const noTerakhir = trx
          .filter((x) => kunciTgl(new Date(x.tanggal)) === hari)
          .reduce((m, x) => Math.max(m, x.no), 0);
        const data = {
          id: "t" + now.getTime(),
          no: noTerakhir + 1,
          tanggal: now.toISOString(),
          catatan: $("#catatan").value.trim(),
          item: cart.map((c) => ({ nama: c.nama, harga: c.harga, qty: c.qty })),
          total: t,

        };
        trx.push(data);
        simpanTrx();
        dbUpS("trx", [data]);
        $("#cart").classList.remove("open");

        tampilStruk(data, true);
      };

      /* ===== Struk ===== */
      function tampilStruk(t, baru) {
        const d = new Date(t.tanggal);
        const baris = (a, b, cls = "") =>
          `<div class="f ${cls}"><span>${a}</span><span>${b}</span></div>`;
        $("#struk").innerHTML = `
    <div class="c b" style="font-size:18px">WARBUL 165</div>
    <div class="c">Warkop</div><div class="d"></div>
    ${baris(tglIndo(d), jam(d))}
    ${baris("No. Transaksi", "#" + pad(t.no).padStart(3, "0"))}
    ${baris("Metode", t.metode || "Tunai")}
    ${t.catatan ? `<div>Catatan: ${esc(t.catatan)}</div>` : ""}
    <div class="d"></div>
    ${t.item.map((i) => `<div>${esc(i.nama)}</div>${baris(`${i.qty} x ${i.harga.toLocaleString("id-ID")}`, rp(i.harga * i.qty))}`).join("")}
    <div class="d"></div>
    ${baris("TOTAL", rp(t.total), "b")}
    ${baris("Uang Diterima", rp(t.dibayar))}
    ${baris("Kembalian", rp(t.kembalian))}
    <div class="d"></div>
    <div class="c">Terima kasih</div><div class="c">Sampai jumpa lagi!</div>`;
        $("#baru").textContent = baru ? "Transaksi Baru" : "Tutup";
        $("#modalStruk").classList.add("on");
      }
      $("#cetak").onclick = () => window.print();
      $("#baru").onclick = () => {
        $("#modalStruk").classList.remove("on");
        if (!$("#vRekap").hidden) renderRekap();
      };

      /* ===== REKAP ===== */
      $("#tgl").value = kunciTgl(new Date());
      $("#tgl").onchange = renderRekap;
      /* Transaksi pada periode terpilih: harian, 7 hari terakhir, atau satu bulan penuh */
      function trxHari() {
        if (!$("#tgl").value) $("#tgl").value = kunciTgl(new Date());
        const [y, mo, da] = $("#tgl").value.split("-").map(Number),
          pr = $("#periode").value;
        let a, b;
        if (pr === "hari") {
          a = new Date(y, mo - 1, da);
          b = new Date(y, mo - 1, da + 1);
        } else if (pr === "minggu") {
          a = new Date(y, mo - 1, da - 6);
          b = new Date(y, mo - 1, da + 1);
        } else {
          a = new Date(y, mo - 1, 1);
          b = new Date(y, mo, 1);
        }
        return trx
          .filter((x) => {
            const t = new Date(x.tanggal);
            return t >= a && t < b;
          })
          .sort((p, q) => new Date(p.tanggal) - new Date(q.tanggal));
      }
      $("#periode").onchange = renderRekap;
      $("#trenRange").onchange = renderTren;
      /* Grafik tren pendapatan (garis) per hari atau per bulan, berakhir di tanggal terpilih */
      function renderTren() {
        if (!$("#tgl").value) $("#tgl").value = kunciTgl(new Date());
        const [y, mo, da] = $("#tgl").value.split("-").map(Number),
          r = $("#trenRange").value,
          bln = r === "12m";
        const pts = [];
        if (bln)
          for (let i = 11; i >= 0; i--) {
            const a = new Date(y, mo - 1 - i, 1);
            pts.push({
              lb: a.toLocaleDateString("id-ID", { month: "short" }),
              tip: a.toLocaleDateString("id-ID", {
                month: "long",
                year: "numeric",
              }),
              a,
              b: new Date(y, mo - i, 1),
              v: 0,
              n: 0,
            });
          }
        else
          for (let i = +r - 1; i >= 0; i--) {
            const a = new Date(y, mo - 1, da - i);
            pts.push({
              lb: a.getDate(),
              tip: tglIndo(a),
              a,
              b: new Date(y, mo - 1, da - i + 1),
              v: 0,
              n: 0,
            });
          }
        trx.forEach((x) => {
          const t = new Date(x.tanggal);
          const p = pts.find((q) => t >= q.a && t < q.b);
          if (p) {
            p.v += x.total;
            p.n++;
          }
        });
        const tot = pts.reduce((s, p) => s + p.v, 0);
        if (!tot) {
          $("#tren").innerHTML =
            '<div class="empty">Belum ada penjualan pada rentang ini.</div>';
          return;
        }
        const f0 = pts[0].a,
          pa = bln
            ? new Date(f0.getFullYear(), f0.getMonth() - 12, 1)
            : new Date(
                f0.getFullYear(),
                f0.getMonth(),
                f0.getDate() - pts.length,
              );
        const prev = trx
          .filter((x) => {
            const t = new Date(x.tanggal);
            return t >= pa && t < f0;
          })
          .reduce((s, x) => s + x.total, 0);
        const best = pts.reduce((m, p) => (p.v > m.v ? p : m), pts[0]);
        const ch = prev > 0 ? ((tot - prev) / prev) * 100 : null;
        const W = 640,
          H = 220,
          L = 46,
          R = 12,
          T = 14,
          B = 26,
          mx = Math.max(...pts.map((p) => p.v)) * 1.1;
        const X = (i) =>
            L + (W - L - R) * (pts.length > 1 ? i / (pts.length - 1) : 0.5),
          Y = (v) => T + (H - T - B) * (1 - v / mx);
        const kc = (v) =>
          v >= 1e6
            ? (v / 1e6).toFixed(1).replace(".0", "") + "jt"
            : Math.round(v / 1000) + "rb";
        let s = `<svg class="tsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik tren penjualan">`;
        for (let g = 0; g <= 4; g++) {
          const v = ((mx / 1.1) * g) / 4,
            yy = Y(v);
          s += `<line class="tg" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="tx" x="${L - 6}" y="${yy + 4}" text-anchor="end">${kc(v)}</text>`;
        }
        const line = pts
          .map(
            (p, i) =>
              (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1),
          )
          .join(" ");
        s += `<path class="ta" d="${line} L${X(pts.length - 1)} ${H - B} L${X(0)} ${H - B}Z"/><path class="tl" d="${line}"/>`;
        const step = pts.length > 14 ? 5 : 1;
        pts.forEach((p, i) => {
          const last = i === pts.length - 1;
          if (pts.length <= 14 || last || p === best)
            s += `<circle class="${last ? "tn" : "td"}" cx="${X(i)}" cy="${Y(p.v)}" r="${last ? 5 : 3.5}"/>`;
          if (i % step === 0 || last)
            s += `<text class="tx" x="${X(i)}" y="${H - 8}" text-anchor="middle">${p.lb}</text>`;
          s += `<circle class="th2" cx="${X(i)}" cy="${Y(p.v)}" r="12"><title>${p.tip}: ${rp(p.v)} (${p.n} transaksi)</title></circle>`;
        });
        s += "</svg>";
        const sat = bln ? "bulan" : "hari";
        const cards = [
          ["Total " + (bln ? "12 Bulan" : pts.length + " Hari"), rp(tot)],
          ["Rata-rata / " + sat, rp(tot / pts.length)],
          [
            (bln ? "Bulan" : "Hari") + " Terbaik",
            best.tip + " · " + rp(best.v),
          ],
          [
            "Dibanding periode sebelumnya",
            ch === null
              ? "-"
              : `<span class="${ch >= 0 ? "good" : "warn"}">${ch >= 0 ? "▲ +" : "▼ "}${Math.abs(ch).toFixed(0)}%</span>`,
          ],
        ];
        $("#tren").innerHTML =
          s +
          '<div class="stats">' +
          cards
            .map(
              ([a, b]) =>
                `<div class="stat"><small>${a}</small><div style="font-size:${a.startsWith("Hari") || a.startsWith("Bulan") ? "16px" : "22px"}">${b}</div></div>`,
            )
            .join("") +
          "</div>";
      }
      $("#hariIni").onclick = () => {
        $("#tgl").value = kunciTgl(new Date());
        renderRekap();
      };
      $("#kemarin").onclick = () => {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        $("#tgl").value = kunciTgl(d);
        renderRekap();
      };

      function renderRekap() {
        renderTren();
        const L = trxHari();
        const tot = L.reduce((s, x) => s + x.total, 0);
        const qty = L.reduce(
          (s, x) => s + x.item.reduce((a, i) => a + i.qty, 0),
          0,
        );
        const mt = (m) =>
          L.filter((x) => (x.metode || "Tunai") === m).reduce(
            (s, x) => s + x.total,
            0,
          );
        const kl = keluarHari(),
          tk = kl.reduce((s, x) => s + x.jumlah, 0);
        renderKeluar(kl);
        $("#stats").innerHTML = [
          ["Total Pendapatan", rp(tot)],
          ["Jumlah Transaksi", L.length],
          ["Item Terjual", qty],
          ["Rata-rata / Transaksi", rp(L.length ? tot / L.length : 0)],
          ["Tunai", rp(mt("Tunai"))],
          ["QRIS", rp(mt("QRIS"))],
          ["Transfer", rp(mt("Transfer"))],
          ["Pengeluaran", rp(tk)],
          ["Laba Bersih", rp(tot - tk)],
        ]
          .map(
            ([a, b]) =>
              `<div class="stat"><small>${a}</small><div>${b}</div></div>`,
          )
          .join("");
        if (!L.length) {
          $("#tbTrx").innerHTML =
            '<div class="empty">Belum ada transaksi pada tanggal ini.</div>';
          $("#chart").innerHTML =
            '<div class="empty" style="width:100%">Belum ada data.</div>';
          $("#tbTop").innerHTML =
            '<div class="empty">Belum ada data penjualan.</div>';
          return;
        }
        /* Grafik batang pendapatan per jam */
        const jm = {};
        L.forEach((x) => {
          const j = new Date(x.tanggal).getHours();
          jm[j] = (jm[j] || 0) + x.total;
        });
        const hs = Object.keys(jm).map(Number),
          lo = Math.min(...hs),
          hi = Math.max(...hs),
          mx = Math.max(...Object.values(jm));
        let cb = "";
        for (let i = lo; i <= hi; i++) {
          const v = jm[i] || 0;
          cb += `<div class="cb" title="${rp(v)}"><small>${v ? Math.round(v / 1000) + "rb" : ""}</small><i style="height:${Math.max(v ? 4 : 1, Math.round((v / mx) * 90))}px"></i><small>${pad(i)}</small></div>`;
        }
        $("#chart").innerHTML = cb;
        $("#tbTrx").innerHTML =
          `<table><tr><th>No</th><th>Jam</th><th>Item</th><th>Metode</th><th class="r">Total</th><th class="r">Bayar</th><th class="r">Kembali</th><th></th></tr>` +
          L.map(
            (
              x,
            ) => `<tr><td>${x.no}</td><td>${$("#periode").value === "hari" ? "" : new Date(x.tanggal).toLocaleDateString("id-ID", { day: "2-digit", month: "short" }) + " "}${jam(new Date(x.tanggal))}</td>
    <td>${x.item.map((i) => esc(i.nama) + " ×" + i.qty).join(", ")}${x.catatan ? `<br><small style="color:var(--mt)">${esc(x.catatan)}</small>` : ""}</td>
    <td>${x.metode || "Tunai"}</td><td class="r">${rp(x.total)}</td><td class="r">${rp(x.dibayar)}</td><td class="r">${rp(x.kembalian)}</td>
    <td style="white-space:nowrap"><button onclick="lihat('${x.id}')">Struk</button> <button class="dng" onclick="batal('${x.id}')">Hapus</button></td></tr>`,
          ).join("") +
          "</table>";
        /* Ringkasan menu terlaris (hanya teks, tanpa foto) */
        const p = {};
        L.forEach((x) =>
          x.item.forEach((i) => {
            p[i.nama] = p[i.nama] || { q: 0, r: 0 };
            p[i.nama].q += i.qty;
            p[i.nama].r += i.qty * i.harga;
          }),
        );
        $("#tbTop").innerHTML =
          `<table><tr><th>Menu</th><th class="r">Terjual</th><th class="r">Pendapatan</th></tr>` +
          Object.entries(p)
            .sort((a, b) => b[1].q - a[1].q || b[1].r - a[1].r)
            .map(
              ([n, v]) =>
                `<tr><td>${esc(n)}</td><td class="r">${v.q}</td><td class="r">${rp(v.r)}</td></tr>`,
            )
            .join("") +
          "</table>";
      }
      function lihat(id) {
        const t = trx.find((x) => x.id === id);
        if (t) tampilStruk(t, false);
      }
      function batal(id) {
        const t = trx.find((x) => x.id === id);
        if (!t) return;
        if (confirm(`Batalkan transaksi #${t.no} senilai ${rp(t.total)}?`)) {
          trx = trx.filter((x) => x.id !== id);
          simpanTrx();
          dbDel("trx", id);
          renderRekap();
          toast("Transaksi dihapus");
        }
      }
      $("#csv").onclick = () => {
        const L = trxHari();
        if (!L.length) return toast("Tidak ada data untuk diexport");
        const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
        const rows = [
          [
            "Tanggal",
            "No",
            "Jam",
            "Item",
            "Catatan",
            "Metode",
            "Total",
            "Dibayar",
            "Kembalian",
          ],
        ];
        L.forEach((x) =>
          rows.push([
            kunciTgl(new Date(x.tanggal)),
            x.no,
            jam(new Date(x.tanggal)),
            x.item.map((i) => i.nama + " x" + i.qty).join("; "),
            x.catatan,
            x.metode || "Tunai",
            x.total,
            x.dibayar,
            x.kembalian,
          ]),
        );
        const blob = new Blob(
          ["\ufeff" + rows.map((r) => r.map(q).join(",")).join("\r\n")],
          { type: "text/csv;charset=utf-8" },
        );
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download =
          "rekap-warbul165-" +
          $("#periode").value +
          "-" +
          $("#tgl").value +
          ".csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      /* ===== KELOLA MENU ===== */
      function renderKelola() {
        $("#tbMenu").innerHTML = menu.length
          ? `<table><tr><th>Nama</th><th>Kategori</th><th class="r">Panas</th><th class="r">Dingin</th><th>Tambahan</th><th></th></tr>` +
            menu
              .map(
                (
                  m,
                ) => `<tr><td>${foto(m, "th")}${esc(m.nama)}${m.habis ? ' <small class="warn">(Habis)</small>' : ""}</td><td>${m.kat === "minuman" ? "Minuman" : "Makanan"}</td>
    <td class="r">${m.kat === "minuman" ? (m.panas ? rp(m.panas) : "-") : rp(m.harga)}</td>
    <td class="r">${m.kat === "minuman" ? (m.dingin ? rp(m.dingin) : "-") : "-"}</td>
    <td>${m.tambahan.map((t) => esc(t.nama) + " (+" + rp(t.harga) + ")").join(", ") || "-"}</td>
    <td style="white-space:nowrap"><button onclick="toggleHabis('${m.id}')">${m.habis ? "Tersedia" : "Habis"}</button> <button onclick="formMenu('${m.id}')">Ubah</button> <button class="dng" onclick="hapusMenu('${m.id}')">Hapus</button></td></tr>`,
              )
              .join("") +
            "</table>"
          : '<div class="empty">Belum ada menu. Tambahkan menu baru.</div>';
      }
      function aturForm() {
        const mn = $("#fKat").value === "minuman";
        $("#fMin").hidden = !mn;
        $("#fMak").hidden = mn;
      }
      $("#fKat").onchange = () => {
        aturForm();
        fotoPrev();
      };
      ["fPanas", "fDingin", "fHarga", "fTamHarga"].forEach(
        (id) =>
          ($("#" + id).oninput = (e) => {
            const n = num(e.target.value);
            e.target.value = n ? n.toLocaleString("id-ID") : "";
          }),
      );
      function formMenu(id) {
        editId = id || null;
        const m = id
          ? menu.find((x) => x.id === id)
          : {
              nama: "",
              kat: "minuman",
              panas: 0,
              dingin: 0,
              harga: 0,
              tambahan: [],
            };
        const f = (n) => (n ? n.toLocaleString("id-ID") : "");
        $("#fJudul").textContent = id ? "Ubah Menu" : "Tambah Menu";
        $("#fNama").value = m.nama;
        $("#fKat").value = m.kat;
        $("#fPanas").value = f(m.panas);
        $("#fDingin").value = f(m.dingin);
        $("#fHarga").value = f(m.harga);
        const t = m.tambahan[0] || { nama: "", harga: 0 };
        $("#fTamNama").value = t.nama;
        $("#fTamHarga").value = f(t.harga);
        gambarForm = m.gambar || "";
        fotoPrev();
        aturForm();
        $("#modalForm").classList.add("on");
        $("#fNama").focus();
      }
      let gambarForm = "";
      function fotoPrev() {
        $("#fPrev").innerHTML =
          foto(
            {
              nama: $("#fNama").value || "Menu",
              kat: $("#fKat").value,
              gambar: gambarForm,
            },
            "ph",
          ) +
          '<small style="color:var(--mt)">' +
          (gambarForm ? "Foto sendiri" : "Ikon bawaan") +
          "</small>";
      }
      $("#fFotoBtn").onclick = () => $("#fFile").click();
      $("#fFotoHapus").onclick = () => {
        gambarForm = "";
        fotoPrev();
      };
      $("#fFile").onchange = (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (f)
          kecilkan(f, (d) => {
            gambarForm = d;
            fotoPrev();
          });
      };
      $("#fNama").oninput = fotoPrev;
      $("#tambahMenu").onclick = () => formMenu();
      $("#fBatal").onclick = () => $("#modalForm").classList.remove("on");
      $("#fSimpan").onclick = () => {
        const nama = $("#fNama").value.trim(),
          k = $("#fKat").value;
        if (!nama) return toast("Nama menu wajib diisi");
        const m = {
          id: editId || "m" + Date.now(),
          nama,
          kat: k,
          panas: 0,
          dingin: 0,
          harga: 0,
          tambahan: [],
          habis: editId
            ? !!(menu.find((x) => x.id === editId) || {}).habis
            : false,
          gambar: gambarForm,
          gambarDingin: editId
            ? (menu.find((x) => x.id === editId) || {}).gambarDingin || ""
            : "",
        };
        if (k === "minuman") {
          m.panas = num($("#fPanas").value);
          m.dingin = num($("#fDingin").value);
          if (!m.panas && !m.dingin)
            return toast("Isi minimal satu harga (Panas/Dingin)");
        } else {
          m.harga = num($("#fHarga").value);
          if (!m.harga) return toast("Harga wajib diisi");
        }
        const tn = $("#fTamNama").value.trim(),
          th = num($("#fTamHarga").value);
        if (tn && th) m.tambahan.push({ nama: tn, harga: th });
        if (editId) menu = menu.map((x) => (x.id === editId ? m : x));
        else menu.push(m);
        simpanMenu();
        $("#modalForm").classList.remove("on");
        renderKelola();
        renderMenu();
        toast("Menu disimpan");
      };
      function hapusMenu(id) {
        const m = menu.find((x) => x.id === id);
        if (m && confirm(`Hapus menu "${m.nama}"?`)) {
          menu = menu.filter((x) => x.id !== id);
          cart = cart.filter((c) => !c.key.startsWith(id + "|"));
          simpanMenu();
          dbDel("menu", id);
          renderKelola();
          renderMenu();
          renderCart();
        }
      }
      $("#resetMenu").onclick = () => {
        if (
          confirm(
            "Kembalikan semua menu ke daftar awal? Perubahan menu akan hilang (riwayat transaksi tetap aman).",
          )
        ) {
          menu = menuAwal();
          cart = [];
          tulis("warbul_menu", menu);
          if (window.cloudSiap)
            sb.from("menu")
              .delete()
              .neq("id", "")
              .then(() => dbUp("menu", menu));
          renderKelola();
          renderMenu();
          renderCart();
          toast("Menu dikembalikan");
        }
      };

      /* ===== Tema gelap / terang ===== */
      function setTema(t) {
        document.documentElement.dataset.tema = t;
        $("#tema").textContent =
          t === "terang" ? "🌙 Mode Gelap" : "☀️ Mode Terang";
        try {
          localStorage.setItem("warbul_tema", t);
        } catch (e) {}
      }
      $("#tema").onclick = () =>
        setTema(
          document.documentElement.dataset.tema === "terang"
            ? "gelap"
            : "terang",
        );
      let temaAwal = "gelap";
      try {
        temaAwal = localStorage.getItem("warbul_tema") || "gelap";
      } catch (e) {}
      setTema(temaAwal);

      /* ===== Pengeluaran (biaya harian) & laba bersih ===== */
      let keluar = baca("warbul_keluar", []);
      if (!Array.isArray(keluar)) keluar = [];
      const simpanKeluar = () => tulis("warbul_keluar", keluar);
      function keluarHari() {
        if (!$("#tgl").value) $("#tgl").value = kunciTgl(new Date());
        const [y, mo, da] = $("#tgl").value.split("-").map(Number),
          pr = $("#periode").value;
        let a, b;
        if (pr === "hari") {
          a = new Date(y, mo - 1, da);
          b = new Date(y, mo - 1, da + 1);
        } else if (pr === "minggu") {
          a = new Date(y, mo - 1, da - 6);
          b = new Date(y, mo - 1, da + 1);
        } else {
          a = new Date(y, mo - 1, 1);
          b = new Date(y, mo, 1);
        }
        return keluar
          .filter((x) => {
            const t = new Date(x.tanggal);
            return t >= a && t < b;
          })
          .sort((p, q) => new Date(p.tanggal) - new Date(q.tanggal));
      }
      function renderKeluar(kl) {
        $("#tbKeluar").innerHTML = kl.length
          ? `<table><tr><th>Tanggal</th><th>Keterangan</th><th class="r">Jumlah</th><th></th></tr>` +
            kl
              .map((x) => {
                const d = new Date(x.tanggal);
                return `<tr><td>${d.toLocaleDateString("id-ID", { day: "2-digit", month: "short" })} ${jam(d)}</td><td>${esc(x.ket)}</td><td class="r">${rp(x.jumlah)}</td><td><button class="dng" onclick="hapusKeluar('${x.id}')">Hapus</button></td></tr>`;
              })
              .join("") +
            "</table>"
          : '<div class="empty">Belum ada pengeluaran pada periode ini.</div>';
      }
      $("#tambahKeluar").onclick = () => {
        $("#kKet").value = "";
        $("#kJml").value = "";
        $("#kTgl").value = $("#tgl").value || kunciTgl(new Date());
        $("#modalKeluar").classList.add("on");
        $("#kKet").focus();
      };
      $("#kJml").oninput = (e) => {
        const n = num(e.target.value);
        e.target.value = n ? rp(n) : "";
      };
      $("#kBatal").onclick = () => $("#modalKeluar").classList.remove("on");
      $("#kSimpan").onclick = () => {
        const ket = $("#kKet").value.trim(),
          jml = num($("#kJml").value);
        if (!ket) return toast("Isi keterangan pengeluaran");
        if (!jml) return toast("Isi jumlah pengeluaran");
        const [y, mo, da] = ($("#kTgl").value || kunciTgl(new Date()))
            .split("-")
            .map(Number),
          n = new Date();
        keluar.push({
          id: "k" + Date.now(),
          tanggal: new Date(
            y,
            mo - 1,
            da,
            n.getHours(),
            n.getMinutes(),
          ).toISOString(),
          ket,
          jumlah: jml,
        });
        simpanKeluar();
        dbUpS("keluar", [keluar[keluar.length - 1]]);
        $("#modalKeluar").classList.remove("on");
        renderRekap();
        toast("Pengeluaran dicatat");
      };
      function hapusKeluar(id) {
        if (confirm("Hapus catatan pengeluaran ini?")) {
          keluar = keluar.filter((x) => x.id !== id);
          simpanKeluar();
          dbDel("keluar", id);
          renderRekap();
        }
      }

      /* ===== Cetak laporan rekap ===== */
      const namaPeriode = {
        hari: "Harian",
        minggu: "7 Hari Terakhir",
        bulan: "Bulanan",
      };
      $("#cetakRekap").onclick = () => {
        const [y, mo, da] = $("#tgl").value.split("-").map(Number);
        $("#judulCetak").textContent =
          "Laporan WARBUL 165 · " +
          namaPeriode[$("#periode").value] +
          " · " +
          tglIndo(new Date(y, mo - 1, da));
        document.body.classList.add("rekap");
        window.print();
      };
      window.addEventListener("afterprint", () =>
        document.body.classList.remove("rekap"),
      );

      /* ===== Metode pembayaran ===== */
      let metode = "Tunai";
      function setMetode(m) {
        metode = m;
        document
          .querySelectorAll("#metode button")
          .forEach((b) => b.classList.toggle("on", b.dataset.m === m));
      }
      document.querySelectorAll("#metode button").forEach(
        (b) =>
          (b.onclick = () => {
            setMetode(b.dataset.m);
            if (b.dataset.m === "Tunai") {
              bayar = 0;
              $("#bayar").value = "";
            }
            renderBayar();
          }),
      );

      /* ===== Tandai menu habis / tersedia ===== */
      function toggleHabis(id) {
        const m = menu.find((x) => x.id === id);
        if (m) {
          m.habis = !m.habis;
          simpanMenu();
          renderKelola();
          renderMenu();
        }
      }

      /* ===== Cadangkan & pulihkan data (menu + transaksi) ===== */
      $("#backup").onclick = () => {
        const blob = new Blob(
          [JSON.stringify({ app: "warbul165", menu, trx, keluar })],
          { type: "application/json" },
        );
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "backup-warbul165-" + kunciTgl(new Date()) + ".json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        tulis("warbul_backup", Date.now());
        infoBackup();
        toast("Cadangan diunduh");
      };
      $("#restore").onclick = () => $("#fileRestore").click();
      $("#fileRestore").onchange = (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const d = JSON.parse(r.result);
            if (
              d.app !== "warbul165" ||
              !Array.isArray(d.menu) ||
              !Array.isArray(d.trx)
            )
              throw 0;
            if (
              !confirm(
                `Pulihkan ${d.trx.length} transaksi dan ${d.menu.length} menu? Data saat ini akan diganti.`,
              )
            )
              return;
            menu = d.menu;
            trx = d.trx;
            keluar = Array.isArray(d.keluar) ? d.keluar : [];
            tulis("warbul_menu", menu);
            simpanTrx();
            simpanKeluar();
            if (window.cloudSiap)
              (async () => {
                for (const t of ["menu", "trx", "keluar"])
                  await sb.from(t).delete().neq("id", "");
                await dbUp("menu", menu);
                await dbUp("trx", trx);
                await dbUp("keluar", keluar);
              })();
            resetKasir();
            renderMenu();
            renderKelola();
            toast("Data dipulihkan");
          } catch (x) {
            toast("File cadangan tidak valid");
          }
        };
        r.readAsText(f);
      };

      /* ===== Info cadangan & penyimpanan permanen ===== */
      function infoBackup() {
        const t = baca("warbul_backup", 0);
        $("#infoBackup").textContent = t
          ? "Cadangan terakhir: " +
            new Date(t).toLocaleDateString("id-ID", {
              day: "2-digit",
              month: "short",
              year: "numeric",
            })
          : "Belum pernah dicadangkan";
      }
      try {
        localStorage.setItem("_cek", "1");
        localStorage.removeItem("_cek");
      } catch (e) {
        $("#peringatan").hidden = false;
      }
      try {
        if (navigator.storage && navigator.storage.persist)
          navigator.storage.persist();
      } catch (e) {}

      /* ===== Mulai ===== */
      renderMenu();
      renderCart();
      infoBackup();

      async function mulaiCloud() {
        const {
          data: { session },
        } = await sb.auth.getSession();
        if (!session) {
          $("#login").classList.add("on");
          return;
        }
        $("#login").classList.remove("on");
        try {
          const [m, t, k] = await Promise.all([
            dbLoad("menu"),
            dbLoad("trx"),
            dbLoad("keluar"),
          ]);
          if (!m.length && !t.length && !k.length) {
            await dbUp("menu", menu);
            await dbUp("trx", trx);
            await dbUp("keluar", keluar);
            toast("Data lama berhasil diunggah ke cloud");
          } else {
            if (m.length) menu = m;
            trx = t;
            keluar = k;
            tulis("warbul_menu", menu);
            tulis("warbul_trx", trx);
            tulis("warbul_keluar", keluar);
            toast("Tersambung ke cloud ✔");
          }
          window.cloudSiap = true;
          renderMenu();
          renderCart();
          renderKelola();
          if (!$("#vRekap").hidden) renderRekap();
        } catch (e) {
          toast("Offline / gagal memuat cloud, memakai data lokal");
        }
      }
      $("#lMasuk").onclick = async () => {
        const { error } = await sb.auth.signInWithPassword({
          email: $("#lEmail").value.trim(),
          password: $("#lPass").value,
        });
        if (error) return toast("Login gagal: " + error.message);
        mulaiCloud();
      };
      $("#lPass").onkeydown = (e) => {
        if (e.key === "Enter") $("#lMasuk").click();
      };
      mulaiCloud();
    </script>
  </body>
</html>
